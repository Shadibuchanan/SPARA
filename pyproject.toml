[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spara"
version = "0.1.0"
description = "Reproducible LIVR planning baseline"
requires-python = ">=3.11,<3.13"
dependencies = ["mathruler==0.1.0", "pylatexenc==2.10", "sympy==1.13.1", "tqdm==4.70.1", "Pillow==11.2.1"]

[project.optional-dependencies]
model = [
  "torch==2.6.0", "torchvision==0.21.0", "transformers==4.51.3",
  "accelerate==1.6.0", "qwen-vl-utils==0.0.11", "numpy==2.2.5",
  "huggingface-hub==0.30.2", "safetensors==0.5.3", "tokenizers==0.21.1",
]
test = ["pytest==8.3.5"]
report = ["matplotlib==3.10.1"]

[project.scripts]
spara = "spara.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the prepared reference dataset or processor"]
