# Settings for scripts/pace/run-all-scaffolding.sh. Edit and they persist.
# Read as shell: KEY=value lines, # for comments.
# Anything set in the environment overrides this file. The Slurm user is always
# $USER, the partition is always ice-gpu, and the account and QoS come from the
# submitting user's default Slurm association; none of those are configured here.

# GPU. Pick an available, permitted card with at least 80 GB.
GPU=gpu:h200:1
#CONSTRAINT=

# CPU cores and host memory for the job.
CPUS=4
MEM=96G

# Walltime in whole hours. The job requests the sum unless HOURS is set.
PILOT_HOURS=1
BASELINE_HOURS=15
#HOURS=16

# Run root holding code/ data/ models/ .venv/ results/.
#ROOT=$HOME/scratch/spara
